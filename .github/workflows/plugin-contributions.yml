name: Plugin contributions

# PRs that add plugin records under knowledge/contributions/ (opened from the bridge page's
# "Contribute" button). `check` validates them and comments what would be published; the
# maintainer approves by adding the `publish-to-lorekit` label, and `publish` writes them into
# LoreKit's built-in layer (the reaper-mcp org) and closes the PR — the records live in LoreKit,
# not in the repo.
#
# pull_request_target runs this file from main with secrets available, so it never checks out or
# runs the PR's code: contribution files are downloaded through the API and only parsed.
#
# Setup: a repo (or `lorekit` environment) secret LOREKIT_PUBLISH_TOKEN, an lk_rw_ token of a
# write-capable member of the reaper-mcp LoreKit org.
#
# Files committed straight to main (by a maintainer) are published by running this workflow by
# hand (Actions → Plugin contributions → Run workflow): `publish-main` publishes every file in
# knowledge/contributions/ and deletes them in one commit — git history is the archive.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    # Runs only when a PR touches the folder; its README is documentation, so a PR that only edits it never runs this.
    # A run that finds no added records passes without a label or comment (see `check`).
    paths: ['knowledge/contributions/**', '!knowledge/contributions/README.md']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only check the files and show what would be published'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: plugin-contributions-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  MARKER: '<!-- plugin-contributions -->'

jobs:
  check:
    if: github.event_name == 'pull_request_target' && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # main, not the PR
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download contribution files
        id: fetch
        run: |
          set +e
          bash scripts/fetch-pr-contributions.sh "$REPO" "$PR" "$HEAD_SHA" "$RUNNER_TEMP/contrib" > "$RUNNER_TEMP/files.txt"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # Optional: a PR that adds no records (it only removes files here) is no contribution, so pass quietly.
          # A refused or unreadable file (non-zero status) still runs the check, so it fails with a comment.
          if [ -s "$RUNNER_TEMP/files.txt" ]; then echo "records=1" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "0" ]; then echo "No plugin records added; nothing to check." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Check records
        id: check
        if: steps.fetch.outputs.records == '1' || steps.fetch.outputs.status != '0'
        env:
          CONTRIBUTION_ROOT: ${{ runner.temp }}/contrib/
          OUTSIDE: ${{ steps.fetch.outputs.status }}
        run: |
          {
            echo "$MARKER"
            echo "### Plugin contribution"
            echo
          } > "$RUNNER_TEMP/comment.md"
          set +e
          xargs -r node scripts/publish-plugin-contributions.mjs --summary "$RUNNER_TEMP/comment.md" < "$RUNNER_TEMP/files.txt" > /dev/null
          ok=$?
          if [ "$OUTSIDE" != "0" ]; then
            printf '\nThis PR changes files outside `knowledge/contributions/`, or a contribution file could not be read (an unexpected file name; see the [workflow run](%s)). A contribution PR can only add records named `knowledge/contributions/<name>.md`; please open code changes separately.\n' "$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" >> "$RUNNER_TEMP/comment.md"
            ok=1
          fi
          if [ "$ok" = "0" ]; then
            printf '\nA maintainer publishes these by adding the `publish-to-lorekit` label. Published plugins are then added to the [built-in plugin list](%s).\n' "$GITHUB_SERVER_URL/$REPO/blob/main/docs/PLUGINS.md" >> "$RUNNER_TEMP/comment.md"
          fi
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          exit $ok

      - name: Label and comment
        if: always() && steps.check.outcome != 'skipped'
        run: |
          gh label create plugin-contribution --repo "$REPO" --color 7cc4ff --description "Plugin records for the built-in LoreKit layer" --force
          gh label create publish-to-lorekit --repo "$REPO" --color 3fb950 --description "Maintainer: publish this PR's plugin records" --force
          gh pr edit "$PR" --repo "$REPO" --add-label plugin-contribution
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi

  publish:
    if: github.event_name == 'pull_request_target' && github.event.action == 'labeled' && github.event.label.name == 'publish-to-lorekit'
    runs-on: ubuntu-latest
    environment: lorekit
    steps:
      - name: Only maintainers can publish
        env:
          SENDER: ${{ github.event.sender.login }}
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$SENDER/permission" --jq .permission)
          case "$perm" in admin|maintain|write) ;; *) echo "::error::$SENDER has $perm access; publishing needs write"; exit 1 ;; esac

      - uses: actions/checkout@v4 # main, not the PR
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download contribution files
        run: bash scripts/fetch-pr-contributions.sh "$REPO" "$PR" "$HEAD_SHA" "$RUNNER_TEMP/contrib" > "$RUNNER_TEMP/files.txt"

      - name: Publish to LoreKit
        env:
          LOREKIT_PUBLISH_TOKEN: ${{ secrets.LOREKIT_PUBLISH_TOKEN }}
          CONTRIBUTION_ROOT: ${{ runner.temp }}/contrib/
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [ -s "$RUNNER_TEMP/files.txt" ] || { echo "::error::No contribution files"; exit 1; }
          printf '%s\n### Plugin contribution\n\n' "$MARKER" > "$RUNNER_TEMP/comment.md"
          xargs node scripts/publish-plugin-contributions.mjs --publish --summary "$RUNNER_TEMP/comment.md" < "$RUNNER_TEMP/files.txt"

      - name: Report and close
        if: success()
        run: |
          printf '\nThanks! These records are now built in for everyone, and the [built-in plugin list](%s) updates in a minute. Closing: the records live in LoreKit, not in the repo.\n' "$GITHUB_SERVER_URL/$REPO/blob/main/docs/PLUGINS.md" >> "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh pr close "$PR" --repo "$REPO"

      - name: Report failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/comment.md" ] || printf '%s\n### Plugin contribution\n\n' "$MARKER" > "$RUNNER_TEMP/comment.md"
          printf '\nPublishing failed; see the [workflow run](%s). Remove and re-add `publish-to-lorekit` to retry.\n' "$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID" >> "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh pr edit "$PR" --repo "$REPO" --remove-label publish-to-lorekit

  publish-main:
    # Only someone with write access can run a workflow by hand, so no extra permission check.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: lorekit
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find contribution files
        id: files
        run: |
          find knowledge/contributions -maxdepth 1 -name '*.md' ! -name README.md | sort > "$RUNNER_TEMP/files.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/files.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/files.txt"

      - name: Publish to LoreKit
        if: steps.files.outputs.count != '0'
        env:
          LOREKIT_PUBLISH_TOKEN: ${{ secrets.LOREKIT_PUBLISH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          echo "### Plugin contributions on main" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          flag=--publish
          [ "$DRY_RUN" = "true" ] && flag=
          # Any invalid file stops the whole run before a write; a failed write keeps every file for a rerun
          xargs node scripts/publish-plugin-contributions.mjs $flag --summary "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/files.txt"

      - name: Remove published files
        if: steps.files.outputs.count != '0' && !inputs.dry_run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          xargs git rm -q < "$RUNNER_TEMP/files.txt"
          git commit -q -m "chore(knowledge): publish ${{ steps.files.outputs.count }} plugin contribution file(s) to LoreKit" \
            -m "Published to the built-in layer by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID; the files stay in git history." \
            -m "$(sed 's/^/- /' "$RUNNER_TEMP/files.txt")"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          printf '\nRemoved the published files from `main`.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing to publish
        if: steps.files.outputs.count == '0'
        run: echo "No contribution files in knowledge/contributions/." >> "$GITHUB_STEP_SUMMARY"
