<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <!-- ReaPack installs the REAPER side (bridge scripts, meters, status page); the package flows into REAPER -->
  <defs>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="560" y1="0" x2="1000" y2="0">
      <stop offset="0" stop-color="#7cc4ff" />
      <stop offset="1" stop-color="#c4a5ff" />
    </linearGradient>
    <radialGradient id="stage" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#0e0f11" />
  <rect width="1600" height="1000" fill="url(#stage)" />

  <g font-family="-apple-system, Inter, 'Segoe UI', sans-serif" text-anchor="middle">
    <!-- Source: the ReaPack repository -->
    <rect x="160" y="370" width="400" height="260" rx="28" fill="#1b1d21" stroke="#2f333a" stroke-width="3" />
    <text x="360" y="482" font-size="48" fill="#e7e9ec">ReaPack</text>
    <text x="360" y="536" font-size="32" fill="#8a909a">reaper-mcp repository</text>

    <!-- REAPER, with what lands in it -->
    <rect x="1000" y="200" width="440" height="600" rx="28" fill="#1b1d21" stroke="url(#accent)" stroke-width="5" />
    <text x="1220" y="282" font-size="48" fill="#e7e9ec">REAPER</text>
    <g font-size="34" fill="#e7e9ec">
      <rect x="1050" y="330" width="340" height="104" rx="22" fill="#0e0f11" stroke="#2f333a" stroke-width="3" />
      <text x="1220" y="395">Bridge scripts</text>
      <rect x="1050" y="456" width="340" height="104" rx="22" fill="#0e0f11" stroke="#2f333a" stroke-width="3" />
      <text x="1220" y="521">Meters</text>
      <rect x="1050" y="582" width="340" height="104" rx="22" fill="#0e0f11" stroke="#2f333a" stroke-width="3" />
      <text x="1220" y="647">Status page</text>
    </g>
  </g>

  <!-- The one moving thing: the package flowing into REAPER -->
  <path d="M580 500 H980" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" opacity="0.35" filter="url(#glow)" />
  <path d="M580 500 H980" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="26 22">
    <animate attributeName="stroke-dashoffset" from="96" to="0" dur="1.2s" repeatCount="indefinite" />
  </path>

  <g font-family="-apple-system, Inter, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="120" y="700" width="480" height="72" rx="36" fill="none" stroke="#2f333a" stroke-width="3" />
    <text x="360" y="748" font-size="32" fill="#7cc4ff">updates like any package</text>
  </g>
</svg>
