# Usage statistics of the bridge status page (mcp_bridge.html).
# Source of truth for every event the page sends; src/lib/analytics.ts (TrackEvent) must match it.
# Sent through the Dash0 Web SDK to the server telemetry's destination (dataset reaper-mcp),
# service.name reaper-mcp-bridge-ui. Consent and promises: TELEMETRY.md, "The bridge page".
#
# Naming: bridge_ui.<object>_<action>, past tense; attributes are bridge_ui.<snake_case>.
# PII: no plugin, track, project or session names, no search text, tokens, paths, hosts or error text.

service: reaper-mcp-bridge-ui
identity: random install id per browser (localStorage mcp_bridge.install_id), sent as user.id
signal_attributes:
  bridge_ui.display_mode: [bridge_window, installed_app, browser_tab]
  page.url.path: [/mcp_bridge.html, /, /other, /local-file/mcp_bridge.html, /local-file]   # bridgePagePath(): never host, port, query or folder
  # page.url.full is the same value. The page's referrer policy is no-referrer, so navigating between the page's own views
  # sends no referrer; a page view reached from a page with a looser policy (a build before this one) still carries what that page sent
automatic:
  - browser.page_view       # startView('/<view>'): the view on load, then each switch of Calls/Tools/Sessions/Plugins/Snapshots
  - web vitals              # @dash0/web-vitals (LCP, CLS, INP)
not_collected:
  - fetch/xhr spans         # the page polls the bridge twice a second and calls LoreKit with a token
  - navigation timing, SDK error events  # their bodies/stacks carry the full page URL (host or LAN IP)

events:
  settings_opened: {}
  changelog_opened:          # the What's new drawer
    source: [header, notice, menu, palette, footer]
    update_available: boolean
  changelog_betas_toggled:
    shown: boolean
  update_clicked:            # asked the bridge to update this install
    source: [changelog, notice, palette]
  update_finished:           # an update this page watched start ended
    result: [ready, current, failed]
    source: [npm, clone]
  update_reload_clicked:     # pressed Reload on the "up to date" toast
    source: [npm, clone]
  setting_changed:
    setting: [paused, readonly, open_on_start, dev, autostart, error_notifications, usage_stats]
    enabled: boolean
    source: [settings, notice]
  app_install_clicked:
    state: string            # install state shown at the click (available, window, installed, …)
  lorekit_token_changed:
    kind: [read, publish]
    connected: boolean
  timeline_range_changed:
    range: string            # range key, e.g. 30m, 1d
  timeline_span_selected:
    selected: boolean
  log_filtered:
    filter: [all, errors]
  log_searched:
    view: [calls, tools, plugins, snapshots]   # once per search; the text is never sent
  log_paused:
    paused: boolean
  log_copied:
    what: [rows, error, params]
  log_cleared: {}
  log_entry_opened:
    ok: boolean
    view: string             # the drawer's edit view kind (timeline, mixer, envelope, …) or none; bounded by editViewOf()
  session_filtered: {}
  tools_sorted:
    sort: string
  tool_picked:
    errors_only: boolean
  session_picked: {}
  plugin_opened:
    coverage: [learned, built-in, unknown]
    in_project: boolean
    formats: number
  plugin_teach_copied:
    scope: [one, many]
    count: number
  plugins_filtered:
    filter: [all, learned, built-in, unknown]
    in_project: boolean
  plugins_grouped:
    grouped: boolean
  plugin_contribute_clicked:
    count: number
    prefilled: boolean
  plugin_publish_completed:  # severity ERROR unless published
    outcome: [published, refused, failed]
    removed_copy: boolean
    replaced: boolean
  bridge_state_changed:      # while the page is open
    state: [live, stale, offline]
  knowledge_load_failed:     # LoreKit records couldn't be loaded
    layer: [built-in, user]
  snapshot_restored:         # the bridge answered a restore from the Snapshots view (or never did: lost)
    outcome: [ok, refused, lost]
    warnings: boolean        # restored with warnings (a track renamed, a plugin changed)
  snapshot_saved:            # the bridge answered a save from the Snapshots view; never the name or description
    outcome: [ok, refused, lost]
    described: boolean
    replaced: boolean        # it replaced a snapshot of the same name
    named: boolean           # false: saved without a name, under the date and time
  snapshot_deleted:          # the bridge answered a delete from the Snapshots view
    outcome: [ok, refused, lost]
  snapshots_cleared:         # the bridge answered a Clear all from the Snapshots view
    outcome: [ok, refused, lost]
  snapshot_edited:           # the bridge answered a rename / description edit from the Snapshots view
    outcome: [ok, refused, lost]
    renamed: boolean         # the name changed (else only the description)
  page_error:                # uncaught error or rejection in the page; severity ERROR
    type: string             # TypeError, RangeError, …, or non_error; never the message or stack

# What would turn red (regression signals, to set up in Dash0):
# - bridge_ui.plugin_publish_completed with outcome != published, by outcome
# - bridge_ui.knowledge_load_failed rate, by layer (LoreKit or token trouble)
# - bridge_ui.bridge_state_changed to offline/stale, per session
# - bridge_ui.page_error by bridge_ui.type after a release (service.version)

# ── The hosted site ──────────────────────────────────────────────────────────────────────────────────────────────
# The public guides (/docs) and changelog (/changelog) on the hosted build (BRIDGE_HOSTED=1, Vercel). A public
# address with no bridge, tokens or LAN host behind it, so the full Web SDK runs there, session replay included.
# src/lib/analytics.ts (SiteEvent) must match this section. The demo at / sends nothing.
#
# Naming: site.<object>_<action>; attributes are site.<snake_case>. The page path rides on every signal as
# page.url.path (SDK), so events carry no guide slug of their own.

site:
  service: reaper-mcp-site            # service.namespace reaper-mcp, same dataset as the bridge page
  identity: random visitor id per browser (localStorage reaper_site.visitor_id), sent as user.id
  consent: on for every visitor; off when the browser sends Global Privacy Control or Do Not Track
  signal_attributes:
    site.page: [docs, changelog]
    deployment.environment.name: [production, preview, development, local]   # from VERCEL_ENV at build time
  automatic:
    - browser.page_view       # the page load, and a virtual page view for each guide opened without a reload
    - web vitals              # LCP, CLS, INP
    - fetch spans             # docs/pages.json and docs/<slug>.md
    - browser errors          # message and stack: the page's code is public
    - rage clicks             # @dash0/frustration-signals, linked to the replay
    - session replay          # browser.session_recording; every input masked (maskAllInputs) and the palette's list, which echoes the query (maskTextSelector), sampled at SITE_REPLAY_SAMPLING
  scrubbed:
    - url query               # ?bridge= carries the viewer's local bridge address; URL attributes only: the replay still records the page address and the back-to-bridge link
    - referrer path and query # referrer policy strict-origin: a link between the site's own pages carries only its origin; a visit
                              # from elsewhere carries what the linking page sends (GitHub's origin, or an older bridge build's address)

  events:
    scroll_depth:              # once per milestone per page path; the bottom of the window passed this share of the page
      depth: [25, 50, 75, 100]
    cta_clicked:               # a link followed (siteCtaOf); other links are not sent
      cta: [demo, install, changelog, github, releases, issues, discord, bridge]
    click:                     # autocapture: one capture-phase listener for plain clicks (button, link, menu item, tab, option)
      label: string            # aria-label or visible text, whitespace folded, cut to 40 characters; never a field value
      path: string             # the data-testid containers from the outside in, at most 4 (guide > pager)
      element: string          # role, else tag (a, button)
      # not sent: no name, no data-testid container, or inside data-capture="off". New controls need markup, never a tracker call
      # the copy, play and release-link controls are data-capture="off": their own event below is the one per press
    code_copied:               # a guide's code block Copy button
      lang: string             # the fence's language (bash, json, …), text when untagged
    prompt_copied: {}          # a guide's "Say this" Copy button
    video_played: {}           # a guide's video facade pressed (the player loads from YouTube only then)
    changelog_betas_toggled:
      shown: boolean
    release_linked:            # a release's version link pressed
      version: string          # a public release version, e.g. 0.86.2

# What would turn red on the hosted site (regression signals, to set up in Dash0, service reaper-mcp-site):
# - fetch spans for docs/pages.json or docs/<slug>.md failing: the guides don't load
# - browser errors by message after a deploy (service.version, deployment.environment.name production)
# - rage clicks per page.url.path rising: a control that looks pressable and isn't
# - LCP / INP p75 per site.page regressing after a deploy
