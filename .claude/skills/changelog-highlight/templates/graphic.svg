<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <!-- House-style highlight graphic. Keep the viewBox, background, palette and type sizes; replace the example:
       a track feeding a bus, the signal flowing along the wire (the one moving thing). -->
  <defs>
    <!-- userSpaceOnUse: a gradient in bounding-box units paints nothing on a straight horizontal or vertical line -->
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="1420" y2="0">
      <stop offset="0" stop-color="#7cc4ff" />
      <stop offset="1" stop-color="#c4a5ff" />
    </linearGradient>
    <radialGradient id="stage" cx="50%" cy="0%" r="90%">
      <stop offset="0" stop-color="#7cc4ff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#7cc4ff" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#0e0f11" />
  <rect width="1600" height="1000" fill="url(#stage)" />

  <g font-family="-apple-system, Inter, 'Segoe UI', sans-serif" text-anchor="middle">
    <!-- Before / quiet element -->
    <rect x="180" y="390" width="380" height="220" rx="28" fill="#1b1d21" stroke="#2f333a" stroke-width="3" />
    <text x="370" y="498" font-size="44" fill="#e7e9ec">Vocal</text>
    <text x="370" y="552" font-size="32" fill="#8a909a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">−6.0 dB</text>

    <!-- The thing that changed: accent border -->
    <rect x="1040" y="390" width="380" height="220" rx="28" fill="#1b1d21" stroke="url(#accent)" stroke-width="5" />
    <text x="1230" y="498" font-size="44" fill="#e7e9ec">Reverb bus</text>
    <text x="1230" y="552" font-size="32" fill="#8a909a">one render pass</text>
  </g>

  <!-- The one moving thing: the signal along the wire (1.2 s loop), with a soft glow under it -->
  <path d="M580 500 H1020" stroke="url(#accent)" stroke-width="18" stroke-linecap="round" opacity="0.35" filter="url(#glow)" />
  <path d="M580 500 H1020" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="26 22">
    <animate attributeName="stroke-dashoffset" from="96" to="0" dur="1.2s" repeatCount="indefinite" />
  </path>

  <!-- Caption chip (optional): the change in a few words -->
  <g font-family="-apple-system, Inter, 'Segoe UI', sans-serif" text-anchor="middle">
    <rect x="610" y="700" width="380" height="72" rx="36" fill="none" stroke="#2f333a" stroke-width="3" />
    <text x="800" y="748" font-size="32" fill="#7cc4ff">sends included</text>
  </g>
</svg>
