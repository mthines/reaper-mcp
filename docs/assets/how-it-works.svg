<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="How it works: you describe what you hear, Claude measures and decides using a mix engineer's knowledge, and changes happen live in your REAPER session. Every change follows snapshot, measure, decide, change, re-measure, report.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1e"/>
      <stop offset="1" stop-color="#1c1240"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3a6"/>
      <stop offset="1" stop-color="#ff7a45"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ffffff" fill-opacity="0.7"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .h { font-size: 26px; font-weight: 800; fill: #ffffff; }
      .p { font-size: 16px; fill: #bdb6e6; }
      .k { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .dash { stroke-dasharray: 6 8; animation: run 1.2s linear infinite; }
      @keyframes run { to { stroke-dashoffset: -28; } }
      @media (prefers-reduced-motion: reduce) { .dash { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>

  <!-- Node 1: You -->
  <g transform="translate(60,48)">
    <rect width="300" height="230" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#22d3a6" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="52" cy="54" r="28" fill="#22d3a6" fill-opacity="0.18"/>
    <text x="52" y="63" font-size="26" text-anchor="middle">🎧</text>
    <text x="96" y="50" class="k" fill="#7ff0d2">STEP 1</text>
    <text x="96" y="76" class="h">You say it</text>
    <text x="28" y="124" class="p">Describe what you hear,</text>
    <text x="28" y="148" class="p">in plain words.</text>
    <rect x="28" y="168" width="244" height="40" rx="12" fill="#ffffff" fill-opacity="0.92"/>
    <text x="150" y="194" font-size="15" font-weight="600" fill="#1a1240" text-anchor="middle">“The low end is muddy.”</text>
  </g>

  <!-- Node 2: Claude -->
  <g transform="translate(450,48)">
    <rect width="300" height="230" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="52" cy="54" r="28" fill="#a78bfa" fill-opacity="0.2"/>
    <text x="52" y="63" font-size="26" text-anchor="middle">🧠</text>
    <text x="96" y="50" class="k" fill="#cbb8ff">STEP 2</text>
    <text x="96" y="76" class="h">Claude thinks</text>
    <text x="28" y="124" class="p">Reads the meters and the</text>
    <text x="28" y="148" class="p">spectrum, then decides like a</text>
    <text x="28" y="172" class="p">mix engineer: genre, frequencies,</text>
    <text x="28" y="196" class="p">and the plugins you own.</text>
  </g>

  <!-- Node 3: REAPER -->
  <g transform="translate(840,48)">
    <rect width="300" height="230" rx="22" fill="#ffffff" fill-opacity="0.05" stroke="#ff7a45" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="52" cy="54" r="28" fill="#ff7a45" fill-opacity="0.2"/>
    <text x="52" y="63" font-size="26" text-anchor="middle">🎚️</text>
    <text x="96" y="50" class="k" fill="#ffb08a">STEP 3</text>
    <text x="96" y="76" class="h">REAPER moves</text>
    <text x="28" y="124" class="p">EQ, compression, levels,</text>
    <text x="28" y="148" class="p">sends and automation change</text>
    <text x="28" y="172" class="p">live in your session. You hear</text>
    <text x="28" y="196" class="p">it right away.</text>
  </g>

  <!-- connectors -->
  <path d="M368 163 H442" stroke="url(#flow)" stroke-width="3" fill="none" class="dash" marker-end="url(#arrow)"/>
  <path d="M758 163 H832" stroke="url(#flow)" stroke-width="3" fill="none" class="dash" marker-end="url(#arrow)"/>

  <!-- loop -->
  <text x="600" y="330" font-size="14" font-weight="700" letter-spacing="2" fill="#9d96c8" text-anchor="middle">EVERY CHANGE, EVERY TIME</text>
  <g transform="translate(60,352)" font-size="16" font-weight="600" text-anchor="middle">
    <rect x="0" width="170" height="52" rx="26" fill="#22d3a6" fill-opacity="0.14" stroke="#22d3a6" stroke-opacity="0.5"/>
    <text x="85" y="32" fill="#7ff0d2">📸  Snapshot</text>
    <text x="186" y="32" fill="#6f6898">›</text>
    <rect x="202" width="170" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="287" y="32" fill="#e8e4ff">📈  Measure</text>
    <text x="388" y="32" fill="#6f6898">›</text>
    <rect x="404" width="170" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="489" y="32" fill="#e8e4ff">💡  Decide</text>
    <text x="590" y="32" fill="#6f6898">›</text>
    <rect x="606" width="170" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="691" y="32" fill="#e8e4ff">🎛️  Change</text>
    <text x="792" y="32" fill="#6f6898">›</text>
    <rect x="808" width="170" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.2"/>
    <text x="893" y="32" fill="#e8e4ff">🔁  Re-measure</text>
    <text x="994" y="32" fill="#6f6898">›</text>
    <rect x="1010" width="70" height="52" rx="26" fill="#ff7a45" fill-opacity="0.16" stroke="#ff7a45" stroke-opacity="0.55"/>
    <text x="1045" y="32" fill="#ffb08a">✓</text>
  </g>
</svg>
