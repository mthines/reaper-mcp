<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Install in three steps: 1. get REAPER, Claude Code and Node.js. 2. paste one command. 3. click Run on mcp_bridge.lua in REAPER.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0b1e"/>
      <stop offset="1" stop-color="#1c1240"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .n { font-size: 30px; font-weight: 800; fill: #0d0b1e; }
      .h { font-size: 23px; font-weight: 800; fill: #ffffff; }
      .p { font-size: 15px; fill: #bdb6e6; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>

  <!-- dotted track -->
  <path d="M130 70 H1070" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- Step 1 -->
  <g transform="translate(40,36)">
    <circle cx="90" cy="34" r="30" fill="#22d3a6"/>
    <text x="90" y="45" class="n" text-anchor="middle">1</text>
    <rect x="0" y="84" width="340" height="160" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="24" y="122" class="h">Get the apps</text>
    <text x="24" y="152" class="p">Free downloads, a few minutes:</text>
    <g font-size="14" font-weight="600" transform="translate(24,172)">
      <rect width="90" height="32" rx="8" fill="#22d3a6" fill-opacity="0.16"/><text x="45" y="21" fill="#7ff0d2" text-anchor="middle">REAPER</text>
      <rect x="100" width="118" height="32" rx="8" fill="#a78bfa" fill-opacity="0.18"/><text x="159" y="21" fill="#cbb8ff" text-anchor="middle">Claude Code</text>
      <rect x="228" width="70" height="32" rx="8" fill="#ff7a45" fill-opacity="0.16"/><text x="263" y="21" fill="#ffb08a" text-anchor="middle">Node</text>
    </g>
  </g>

  <!-- Step 2 -->
  <g transform="translate(430,36)">
    <circle cx="170" cy="34" r="30" fill="#a78bfa"/>
    <text x="170" y="45" class="n" text-anchor="middle">2</text>
    <rect x="0" y="84" width="340" height="160" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="24" y="122" class="h">Paste one command</text>
    <text x="24" y="152" class="p">It installs and connects everything.</text>
    <rect x="24" y="168" width="292" height="44" rx="10" fill="#05040c" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="40" y="196" class="mono" font-size="15" fill="#e8e4ff"><tspan fill="#7ff0d2">$</tspan> ./scripts/install.sh</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(820,36)">
    <circle cx="250" cy="34" r="30" fill="#ff7a45"/>
    <text x="250" y="45" class="n" text-anchor="middle">3</text>
    <rect x="0" y="84" width="340" height="160" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="24" y="122" class="h">Click Run in REAPER</text>
    <text x="24" y="152" class="p">Load mcp_bridge.lua once. Done.</text>
    <rect x="24" y="168" width="150" height="44" rx="10" fill="#ff7a45"/>
    <text x="99" y="196" font-size="16" font-weight="700" fill="#1a0a05" text-anchor="middle">▶  Run</text>
    <text x="190" y="196" font-size="15" font-weight="600" fill="#7ff0d2">● Bridge live</text>
  </g>
</svg>
