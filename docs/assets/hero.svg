<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="reaper-mcp — Mix by talking. An AI mix engineer inside your REAPER session.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b1e"/>
      <stop offset="0.55" stop-color="#1a1240"/>
      <stop offset="1" stop-color="#2a0f3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.12" cy="0.9" r="0.45">
      <stop offset="0" stop-color="#22d3a6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meter" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3a6"/>
      <stop offset="0.7" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff5c5c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffc7a8"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .bar { transform-box: fill-box; transform-origin: bottom; animation: pulse 1.6s ease-in-out infinite alternate; }
      .b2 { animation-duration: 1.1s; } .b3 { animation-duration: 1.9s; } .b4 { animation-duration: 1.3s; }
      .b5 { animation-duration: 2.2s; } .b6 { animation-duration: 1.5s; }
      @keyframes pulse { from { transform: scaleY(0.55); } to { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { .bar { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="460" rx="28" fill="url(#glow)"/>
  <rect width="1200" height="460" rx="28" fill="url(#glow2)"/>

  <!-- Left: copy -->
  <g transform="translate(72,0)">
    <rect x="0" y="78" width="178" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="20" cy="95" r="5" fill="#22d3a6"/>
    <text x="34" y="101" font-size="15" font-weight="600" fill="#d9d4ff" letter-spacing="0.5">reaper-mcp</text>

    <text x="0" y="196" font-size="72" font-weight="800" fill="url(#title)" letter-spacing="-2">Mix by talking.</text>
    <text x="0" y="250" font-size="24" fill="#cfc9f2">An AI mix engineer that works inside</text>
    <text x="0" y="284" font-size="24" fill="#cfc9f2">your <tspan fill="#ffffff" font-weight="700">REAPER</tspan> session. It listens, measures,</text>
    <text x="0" y="318" font-size="24" fill="#cfc9f2">and turns the knobs. You make the calls.</text>

    <g transform="translate(0,360)">
      <rect width="150" height="40" rx="10" fill="#22d3a6" fill-opacity="0.14" stroke="#22d3a6" stroke-opacity="0.5"/>
      <text x="75" y="26" font-size="16" font-weight="600" fill="#7ff0d2" text-anchor="middle">Gain staging</text>
      <rect x="162" width="130" height="40" rx="10" fill="#ff7a45" fill-opacity="0.14" stroke="#ff7a45" stroke-opacity="0.5"/>
      <text x="227" y="26" font-size="16" font-weight="600" fill="#ffb08a" text-anchor="middle">Mixing</text>
      <rect x="304" width="140" height="40" rx="10" fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.55"/>
      <text x="374" y="26" font-size="16" font-weight="600" fill="#cbb8ff" text-anchor="middle">Mastering</text>
    </g>
  </g>

  <!-- Right: chat bubble + mini mixer -->
  <g transform="translate(700,58)">
    <!-- chat bubble -->
    <rect x="40" y="0" width="400" height="74" rx="18" fill="#ffffff" fill-opacity="0.96"/>
    <path d="M400 74 L420 96 L384 74 Z" fill="#ffffff" fill-opacity="0.96"/>
    <text x="64" y="32" font-size="14" font-weight="700" fill="#7a6cc4">YOU</text>
    <text x="64" y="57" font-size="19" font-weight="600" fill="#1a1240">“Make the vocals cut through.”</text>

    <!-- mixer card -->
    <rect x="0" y="112" width="440" height="230" rx="18" fill="#0b0918" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.12"/>
    <g font-size="12" fill="#9d96c8" text-anchor="middle" class="mono">
      <text x="50" y="326">KICK</text><text x="118" y="326">BASS</text><text x="186" y="326">GTR</text>
      <text x="254" y="326" fill="#ffb08a" font-weight="700">VOX</text><text x="322" y="326">KEYS</text><text x="390" y="326">MIX</text>
    </g>
    <!-- meters -->
    <g>
      <rect x="40" y="136" width="20" height="170" rx="4" fill="#ffffff" fill-opacity="0.06"/>
      <rect class="bar" x="40" y="186" width="20" height="120" rx="4" fill="url(#meter)"/>
      <rect x="108" y="136" width="20" height="170" rx="4" fill="#ffffff" fill-opacity="0.06"/>
      <rect class="bar b2" x="108" y="196" width="20" height="110" rx="4" fill="url(#meter)"/>
      <rect x="176" y="136" width="20" height="170" rx="4" fill="#ffffff" fill-opacity="0.06"/>
      <rect class="bar b3" x="176" y="206" width="20" height="100" rx="4" fill="url(#meter)"/>
      <rect x="244" y="136" width="20" height="170" rx="4" fill="#ff7a45" fill-opacity="0.12" stroke="#ff7a45" stroke-opacity="0.6"/>
      <rect class="bar b4" x="244" y="160" width="20" height="146" rx="4" fill="url(#meter)"/>
      <rect x="312" y="136" width="20" height="170" rx="4" fill="#ffffff" fill-opacity="0.06"/>
      <rect class="bar b5" x="312" y="220" width="20" height="86" rx="4" fill="url(#meter)"/>
      <rect x="380" y="136" width="20" height="170" rx="4" fill="#ffffff" fill-opacity="0.06"/>
      <rect class="bar b6" x="380" y="176" width="20" height="130" rx="4" fill="url(#meter)"/>
    </g>
    <!-- action chip -->
    <rect x="200" y="356" width="240" height="40" rx="12" fill="#22d3a6" fill-opacity="0.16" stroke="#22d3a6" stroke-opacity="0.6"/>
    <text x="320" y="382" font-size="15" font-weight="600" fill="#7ff0d2" text-anchor="middle">✓ Vocal +2.1 dB in 2–4 kHz</text>
  </g>
</svg>
